# The URL the site will be built for
base_url = "https://example.com"

title = "サンプルタイトル"

description = "説明文"

default_language = "ja"

# The default author for pages
# copyright の表示に使われる、もし未指定や空文字の場合、 title が copyright に表示される
author = "著者名"

# Whether to generate a feed file (atom.xml) for the whole site
generate_feeds = true

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# The taxonomies to be rendered for the site
# page にてタグが一つも定義されていない場合、 /tags/ 以下は作成されない
taxonomies = [
  { name = "tags", paginate_by = 10 },
]

# Various slugification strategies
[slugify]
taxonomies = "safe"

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here

# 配色モード。"auto" | "light" | "dark"
# auto は OS の設定（prefers-color-scheme）に従う
# light / dark は <html> に data-theme 属性を出力して固定する
color_scheme = "light"

sections_in_footer_nav = []

# header_nav（templates/base/header/header_nav.html）の設定
# type = "section" | "taxonomy"
# title = ""
# title を指定すると、自動解決されるタイトル（section の title / taxonomy の name）を上書きできる
# type = "section" で path の section が存在しない場合（draft など）、その項目は表示を省略する
[[extra.header_nav]]
type = "section"
path = "articles/_index.md"
# title = "記事一覧"

# content/articles/examples/ 配下を指している。examples/_index.md を draft = true にすると、この項目は表示されなくなる
[[extra.header_nav]]
type = "section"
path = "articles/examples/sections/_index.md"
# title = "記事分類"

[[extra.header_nav]]
type = "taxonomy"
kind = "tags"
title = "タグリスト"

# フッタ（templates/base/footer/）の設定
[extra.footer]
copyright_start_year = 2026

[extra.footer.labels]
home = "トップページ"

# 記事ページ（templates/page.html）に出すメタ情報のラベル
[extra.page.labels]
date = "作成日:"
updated = "更新日:"
tags = "タグ:"
